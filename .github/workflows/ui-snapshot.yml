name: UI Snapshot (simulator)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d /Applications/Xcode_16.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        run: |
          xcrun simctl list devices available | head -40
          LINE=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | head -1)
          UDID=$(echo "$LINE" | sed -E 's/.*\(([0-9A-Fa-f-]+)\) \(.*/\1/')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available" >&2
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator: $LINE ($UDID)"

      - name: Build for simulator
        working-directory: ios
        run: |
          mkdir -p build
          xcodebuild \
            -project AirWave.xcodeproj \
            -scheme AirWave \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/Sim \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/sim-build.log
          # xcodebuild can return non-zero for a benign ambiguous-destination
          # warning even after "BUILD SUCCEEDED"; validate the product instead.
          test -d build/Sim/Build/Products/Debug-iphonesimulator/AirWave.app

      - name: Boot simulator and capture
        working-directory: ios
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          APP="build/Sim/Build/Products/Debug-iphonesimulator/AirWave.app"
          test -d "$APP"
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" com.wilsonfd.airwave
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot ui-idle.png

          xcrun simctl terminate "$SIM_UDID" com.wilsonfd.airwave 2>/dev/null || true
          xcrun simctl launch "$SIM_UDID" com.wilsonfd.airwave -ShowSettings -DemoSavedIPs
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot ui-settings.png
          ls -lh ui-idle.png ui-settings.png

      - name: Publish screenshot to ui-snapshot branch
        run: |
          set -euo pipefail
          git config user.name "AirWave Bot"
          git config user.email "bot@local"
          mkdir -p docs
          cp ios/ui-idle.png docs/ios-ui.png
          cp ios/ui-settings.png docs/ios-settings.png
          git checkout -B ui-snapshot
          git add docs/ios-ui.png docs/ios-settings.png
          git commit -m "Update iPhone UI snapshots [skip ci]"
          git push -f origin ui-snapshot

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AirWave-ui-snapshot
          path: |
            ios/ui-idle.png
            ios/ui-settings.png
          if-no-files-found: ignore
          retention-days: 7
