name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename and inspect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AirWave-2.2.0-android.apk
          ls -lh AirWave-2.2.0-android.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging AirWave-2.2.0-android.apk | head -12

      - uses: actions/upload-artifact@v4
        with:
          name: AirWave-android
          path: AirWave-2.2.0-android.apk
          if-no-files-found: error
