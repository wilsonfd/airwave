name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename and inspect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AirWave-2.2.0-android.apk
          ls -lh AirWave-2.2.0-android.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging AirWave-2.2.0-android.apk | head -12

      - uses: actions/upload-artifact@v4
        with:
          name: AirWave-android
          path: AirWave-2.2.0-android.apk
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AirWave-android

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r AirWave-2.2.0-android.apk
            adb shell am start -n com.wilsonfd.airwave/.MainActivity
            sleep 6
            adb exec-out screencap -p > android-ui.png
            adb logcat -d -t 400 > android-log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AirWave-android-ui
          path: |
            android-ui.png
            android-log.txt
          if-no-files-found: warn
