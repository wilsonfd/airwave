name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

concurrency:
  group: airwave-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d /Applications/Xcode_16.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project AirWave.xcodeproj \
            -scheme AirWave \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/AirWave.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee build/xcodebuild.log

      - name: Package IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/AirWave.xcarchive/Products/Applications/AirWave.app"
          test -d "$APP"
          rm -rf build/Payload build/AirWave-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload AirWave-unsigned.ipa
          ls -lh AirWave-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirWave-unsigned
          path: ios/build/AirWave-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AirWave-build-log
          path: ios/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
